<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.5/moment-timezone-with-data-1970-2030.min.js"></script>
    <link href="src/styles.css" rel="stylesheet" type="text/css" />

    <title>Celeste's World Clock </title>
</head>

<body>
    <div class="container">
        <h1> World Clocks </h1>

        <select id="citySelect">
            <option value="">Select a city...</option>
            <option value="Europe/Amsterdam">Amsterdam</option>
            <option value="Australia/Perth">Perth</option>
            <option value="Asia/Dubai">Dubai</option>
            <option value="Africa/Johannesburg">Cape Town</option>
        </select>

        <div id="cities">
            <div class="city-one" id="cityOne">
                <div>
                    <h2> Johannesburg </h2>
                    <div class="date" id="cityOneDate"></div>
                </div>
                <div class="time" id="cityOneTime"></div>
            </div>

            <div class="city-two" id="cityTwo">
                <div>
                    <h2> London </h2>
                    <div class="date" id="cityTwoDate"></div>
                </div>
                <div class="time" id="cityTwoTime"></div>
            </div>
        </div>

        <footer>
            This project was coded by <a href="https://github.com/cwildlife" target="_blank">Celeste Rust</a> and is
            open-sourced on <a href="https://github.com/cwildlife/celeste-world-clock" target="_blank"> Github</a>.
            The project is hosted on <a href="https://celeste-world-clock.vercel.app/" target="_blank">Vercel</a>.
        </footer>
        <script src="src/script.js"></script>
    </div>
</body>

</html>
